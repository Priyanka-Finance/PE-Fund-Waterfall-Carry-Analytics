[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pefund"
version = "1.0.0"
description = "AI-enabled private equity fund waterfall and carry analytics platform (Excel, Python, Gen AI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanmay Kumar" }]
keywords = ["private equity", "venture capital", "waterfall", "carried interest", "IRR", "fund modelling"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.40"]
app = ["streamlit>=1.36", "plotly>=5.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
all = ["pefund[ai,app,dev]"]

[project.scripts]
pefund = "pefund.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# E501: line length is the formatter's job; long f-strings and aligned tables are left alone.
# SIM108: an explicit if/else is clearer than a long ternary in the numerical code.
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["pefund", "conftest"]
